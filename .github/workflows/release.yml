name: Release

on:
  workflow_dispatch:
    inputs:
      nativeVersion:
        description: 'Native artifact version (leave empty for auto)'
        required: false
        default: ''
      deploymentId:
        description: 'Existing Maven Central deployment to resume'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve effective version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.nativeVersion }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -n1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Download latest merged native artifacts
        uses: dawidd6/action-download-artifact@v23
        with:
          workflow: build.yml
          branch: main
          name: native-merged
          path: target/staging-deploy
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native artifacts to local Maven
        run: |
          set -euo pipefail
          mkdir -p ~/.m2/repository
          cp -r target/staging-deploy/com ~/.m2/repository/
          find ~/.m2/repository/com/xenoamess/hyperscan_panama

      - name: Build and install wrapper
        run: |
          set -euo pipefail
          mvn -B install -N -DskipTests
          mvn -B install -pl wrapper -DskipTests \
            -Dnative.classifier=linux-x86_64

      - name: Copy wrapper artifacts to staging deploy
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Copy parent POM
          PARENT_SRC="$HOME/.m2/repository/com/xenoamess/hyperscan_panama/hyperscan-java-panama-parent/$VERSION"
          PARENT_DST="$PWD/target/staging-deploy/com/xenoamess/hyperscan_panama/hyperscan-java-panama-parent/$VERSION"
          mkdir -p "$PARENT_DST"
          cp "$PARENT_SRC"/*.pom "$PARENT_DST/"
          # Copy wrapper (jar, pom, sources, javadoc only)
          SRC="$HOME/.m2/repository/com/xenoamess/hyperscan_panama/hyperscan-java-panama/$VERSION"
          DST="$PWD/target/staging-deploy/com/xenoamess/hyperscan_panama/hyperscan-java-panama/$VERSION"
          mkdir -p "$DST"
          cp "$SRC"/*.jar "$DST/" 2>/dev/null || true
          cp "$SRC"/*.pom "$DST/" 2>/dev/null || true
          # Clean any _remote.repositories or checksum files from staging
          find target/staging-deploy -name '_remote.repositories*' -delete
          find target/staging-deploy -name '*.sha1' -delete
          find target/staging-deploy -name '*.sha256' -delete
          find target/staging-deploy -name '*.sha512' -delete
          find target/staging-deploy -name '*.md5' -delete
          find target/staging-deploy -name '*.asc' -delete
          find target/staging-deploy -type f

      - name: Deploy to Maven Central
        if: github.event.inputs.deploymentId == ''
        uses: jreleaser/release-action@v2
        with:
          version: 1.14.0
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGN_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGN_KEY_PASS }}

      - name: Resume Maven Central deployment
        if: github.event.inputs.deploymentId != ''
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deploymentId }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          STATUS_URL="https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"
          PUBLISH_URL="https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID"
          PUBLISH_REQUESTED=false

          for ATTEMPT in $(seq 1 180); do
            if ! RESPONSE=$(curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $AUTH" "$STATUS_URL"); then
              echo "Maven Central status request failed (attempt $ATTEMPT/180)" >&2
              sleep 10
              continue
            fi
            STATE=$(jq -r '.deploymentState' <<< "$RESPONSE")
            echo "Maven Central deployment $DEPLOYMENT_ID is $STATE (attempt $ATTEMPT/180)"
            case "$STATE" in
              PUBLISHED)
                exit 0
                ;;
              VALIDATED)
                if [ "$PUBLISH_REQUESTED" = false ]; then
                  curl --fail-with-body --silent --show-error \
                    -X POST -H "Authorization: Bearer $AUTH" "$PUBLISH_URL"
                  PUBLISH_REQUESTED=true
                fi
                ;;
              FAILED)
                jq '.errors' <<< "$RESPONSE"
                exit 1
                ;;
              PENDING|VALIDATING|PUBLISHING)
                ;;
              *)
                echo "Unexpected Maven Central deployment state: $STATE" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for Maven Central deployment $DEPLOYMENT_ID" >&2
          exit 1

      - name: Collect JARs for GitHub Release
        run: |
          mkdir -p release-jars
          cp target/staging-deploy/com/xenoamess/hyperscan_panama/*/*/*/*.jar release-jars/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release-jars/*.jar
          generate_release_notes: true
          prerelease: true
